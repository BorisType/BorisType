packages:
  - "packages/*"
  - "tests"
  - "examples/single"
  - "examples/multi"
  - "examples/multi/backend"
  - "examples/library"
  - "examples/component"
ignoreScripts: true
ignorePnpmfile: true
blockExoticSubdeps: true
minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - "@boristype/bt-cli"
  - "@boristype/bt-ir"
  - "@boristype/runtime"
  - "@boristype/ws-client"
  - "@boristype/ws-version"
  - "@boristype/http-handler"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
trustLockfile: false
patchedDependencies:
  # saxes 6.0.0 handler aliases omit the bounds required by their referenced types.
  # Only declarations change; retain strict library checking under TypeScript 6.
  saxes@6.0.0: patches/saxes@6.0.0.patch
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
verifyDepsBeforeRun: error
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
overrides:
  # GHSA-587h-7wmj-h5pm: patched editor launch handling on Windows.
  "vitepress>vite": "^6.4.5"
  "@vitejs/plugin-vue>vite": "^6.4.5"
  "@changesets/cli>launch-editor": "^2.14.2"
  # GHSA-68fv: force patched source-map-js (transitive via vitepress > vue compiler / postcss)
  "source-map-js": "^1.2.2"
  # GHSA-pqg4-j6r4-53mv: patched command quoting for Changesets' editor launcher.
  "launch-editor>shell-quote": "^1.12.0"
