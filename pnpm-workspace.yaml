packages:
  - "packages/*"
  - "tests"
  - "examples/single"
  - "examples/multi"
  - "examples/multi/backend"
  - "examples/library"
  - "examples/component"
ignoreScripts: true
ignorePnpmfile: true
blockExoticSubdeps: true
minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - "@boristype/bt-cli"
  - "@boristype/bt-ir"
  - "@boristype/runtime"
  - "@boristype/ws-client"
  - "@boristype/ws-version"
  - "@boristype/http-handler"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
trustLockfile: false
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
verifyDepsBeforeRun: error
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
overrides:
  "vitepress>vite": "^6.4.3"
  "@vitejs/plugin-vue>vite": "^6.4.3"
