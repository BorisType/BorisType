name: .NET workspace

on:
  push:
    branches: [main]
    paths:
      - "global.json"
      - "packages/dotnet/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [main]
    paths:
      - "global.json"
      - "packages/dotnet/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: Build, test and pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: packages/dotnet/**/packages.lock.json

      - name: Setup Node.js for package verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Locked restore
        run: dotnet restore packages/dotnet/BorisType.DotNet.slnx --locked-mode

      - name: Build
        run: dotnet build packages/dotnet/BorisType.DotNet.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test packages/dotnet/BorisType.DotNet.slnx --configuration Release --no-build --no-restore

      - name: Verify installation ZIP
        run: node --test packages/dotnet/test/pack.test.mjs

      - name: Create installation ZIP
        run: node packages/dotnet/tools/pack.mjs

      - name: Upload installation ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boristype-dotnet-${{ matrix.os }}
          path: packages/dotnet/dist/*.zip
          if-no-files-found: error
