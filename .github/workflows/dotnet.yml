name: .NET workspace

on:
  push:
    branches: [main]
    paths:
      - "global.json"
      - "packages/dotnet/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [main]
    paths:
      - "global.json"
      - "packages/dotnet/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: Build, test and pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: packages/dotnet/**/packages.lock.json

      - name: Setup Node.js for package verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Locked restore
        run: dotnet restore packages/dotnet/BorisType.DotNet.slnx --locked-mode

      - name: Build
        run: dotnet build packages/dotnet/BorisType.DotNet.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test packages/dotnet/BorisType.DotNet.slnx --configuration Release --no-build --no-restore

      - name: Verify installation ZIP
        run: node --test packages/dotnet/test/pack.test.mjs

      - name: Create installation ZIP
        run: node packages/dotnet/tools/pack.mjs

      - name: Upload installation ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: boristype-dotnet-${{ matrix.os }}
          path: packages/dotnet/dist/*.zip
          if-no-files-found: error
