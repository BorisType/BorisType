name: Publish npm package

on:
  push:
    tags: ["@boristype/**"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.release.outputs.name }}
      sha512: ${{ steps.pack.outputs.sha512 }}
    steps:
      - name: Checkout release commit and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate package tag and commit
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/release.mjs validate "$RELEASE_TAG"

      - name: Test release helpers
        run: pnpm release:test

      - name: Build package and dependency closure
        env:
          RELEASE_PACKAGE: ${{ steps.release.outputs.name }}
        run: pnpm --filter "$RELEASE_PACKAGE..." build

      - name: Run package and dependency tests
        env:
          RELEASE_PACKAGE: ${{ steps.release.outputs.name }}
        run: pnpm --filter "$RELEASE_PACKAGE..." --if-present test

      - name: Pack once and inspect manifest and files
        id: pack
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/release.mjs pack "$RELEASE_TAG" "$RUNNER_TEMP/npm-release"

      - name: Check published dependencies and install the archive in isolation
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA512: ${{ steps.pack.outputs.sha512 }}
        run: node tools/release.mjs smoke "$RELEASE_TAG" "$RUNNER_TEMP/npm-release"

      - name: Upload verified archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release/package.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ needs.package.outputs.name }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout release commit and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download verified archive from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release

      - name: Publish the verified archive with npm trusted publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA512: ${{ needs.package.outputs.sha512 }}
        run: node tools/release.mjs publish "$RELEASE_TAG" "$RUNNER_TEMP/npm-release"
