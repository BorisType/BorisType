name: Lint & Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-format:
    name: ESLint & Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency versions
        run: pnpm check-versions

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm exec turbo run build

      - name: ESLint
        run: pnpm lint

      - name: Unit tests
        run: pnpm --filter @boristype/bt-ir --filter @boristype/eslint-plugin --filter @boristype/ws-client --filter @boristype/mcp-server test

      - name: MCP package smoke test
        run: pnpm --filter @boristype/mcp-server test:pack

      - name: Prettier
        run: pnpm format:check
