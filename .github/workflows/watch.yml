name: CLI file watcher

on:
  push:
    branches: [main]
    paths:
      - "packages/bt-cli/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - ".github/workflows/watch.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/bt-cli/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - ".github/workflows/watch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watcher:
    name: File events and shutdown (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI and workspace dependencies
        run: pnpm --filter @boristype/bt-cli... build

      - name: Verify real filesystem events and clean shutdown
        run: pnpm --filter @boristype/bt-cli test
